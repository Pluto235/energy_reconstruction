<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0072B2"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#D55E00"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#009E73"/>
    </marker>
    <style>
      .title { font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #17202a; }
      .lane-title { font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif; font-size: 29px; font-weight: 700; }
      .node-title { font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif; font-size: 25px; font-weight: 650; fill: #17202a; }
      .node-sub { font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #4b5563; }
      .badge { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
      .small { font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif; font-size: 16px; fill: #667085; }
      .obs-box { fill: #F2F8FC; stroke: #0072B2; stroke-width: 2.2; }
      .mc-box { fill: #FFF7F1; stroke: #D55E00; stroke-width: 2.2; }
      .fit-box { fill: #F1FAF7; stroke: #009E73; stroke-width: 2.4; }
      .out-box { fill: #FFFBEA; stroke: #C79200; stroke-width: 2.4; }
      .arrow-blue { fill: none; stroke: #0072B2; stroke-width: 3; marker-end: url(#arrow-blue); }
      .arrow-orange { fill: none; stroke: #D55E00; stroke-width: 3; marker-end: url(#arrow-orange); }
      .arrow-green { fill: none; stroke: #009E73; stroke-width: 3.2; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <text x="960" y="57" text-anchor="middle" class="title">从观测数据与模拟数据到最终 SED 的 v6 分析流程</text>
  <line x1="80" y1="82" x2="1840" y2="82" stroke="#D7DDE5" stroke-width="2"/>

  <rect x="78" y="106" width="790" height="500" rx="8" fill="#F8FBFD" stroke="#B8D9EA" stroke-width="1.6"/>
  <rect x="1052" y="106" width="790" height="500" rx="8" fill="#FFFBF7" stroke="#F0C7AE" stroke-width="1.6"/>
  <text x="473" y="145" text-anchor="middle" class="lane-title" fill="#0072B2">观测数据分支</text>
  <text x="1447" y="145" text-anchor="middle" class="lane-title" fill="#D55E00">模拟数据与仪器响应分支</text>

  <rect x="135" y="168" width="676" height="82" rx="8" class="obs-box"/>
  <rect x="151" y="184" width="62" height="25" rx="5" fill="#0072B2"/>
  <text x="182" y="202" text-anchor="middle" class="badge">INPUT</text>
  <text x="236" y="199" class="node-title">WCDA 64748 观测数据</text>
  <text x="236" y="228" class="node-sub">事件级重建量 + recovered time / MJD</text>

  <path d="M473,250 L473,276" class="arrow-blue"/>
  <rect x="135" y="280" width="676" height="82" rx="8" class="obs-box"/>
  <text x="164" y="314" class="node-title">AI 模型推理与质量筛选</text>
  <text x="164" y="343" class="node-sub">得到 predE；应用 Nhit、天顶角和事件质量 cuts</text>

  <path d="M473,362 L473,388" class="arrow-blue"/>
  <rect x="135" y="392" width="676" height="82" rx="8" class="obs-box"/>
  <rect x="151" y="408" width="86" height="25" rx="5" fill="#0072B2"/>
  <text x="194" y="426" text-anchor="middle" class="badge">STAGE C</text>
  <text x="258" y="423" class="node-title">按 (Nhit, predE) 分配 cell</text>
  <text x="164" y="452" class="node-sub">形成半年事件样本，供 Stage D 构建各 cell 的 counts skymap</text>

  <path d="M473,474 L473,500" class="arrow-blue"/>
  <rect x="135" y="504" width="676" height="82" rx="8" class="obs-box"/>
  <rect x="151" y="520" width="105" height="25" rx="5" fill="#0072B2"/>
  <text x="203" y="538" text-anchor="middle" class="badge">STAGE D-E</text>
  <text x="278" y="535" class="node-title">背景估计与信号提取</text>
  <text x="164" y="564" class="node-sub">环带二次曲面背景 → N_on、B_on、excess 与统计误差</text>

  <rect x="1109" y="168" width="676" height="82" rx="8" class="mc-box"/>
  <rect x="1125" y="184" width="62" height="25" rx="5" fill="#D55E00"/>
  <text x="1156" y="202" text-anchor="middle" class="badge">INPUT</text>
  <text x="1210" y="199" class="node-title">空气簇射与探测器模拟</text>
  <text x="1210" y="228" class="node-sub">已知 Etrue、theta、到源方向差及事件权重</text>

  <path d="M1447,250 L1447,276" class="arrow-orange"/>
  <rect x="1109" y="280" width="676" height="82" rx="8" class="mc-box"/>
  <text x="1138" y="314" class="node-title">通过与观测一致的重建链</text>
  <text x="1138" y="343" class="node-sub">得到 Nhit、predE，并使用相同 cell 定义与 cuts</text>

  <path d="M1447,362 L1447,388" class="arrow-orange"/>
  <rect x="1109" y="392" width="676" height="82" rx="8" class="mc-box"/>
  <rect x="1125" y="408" width="86" height="25" rx="5" fill="#D55E00"/>
  <text x="1168" y="426" text-anchor="middle" class="badge">STAGE A</text>
  <text x="1232" y="423" class="node-title">构建有效面积响应</text>
  <text x="1138" y="452" class="node-sub">Aeff(cell, Etrue, theta) 与能量迁移关系</text>

  <path d="M1447,474 L1447,500" class="arrow-orange"/>
  <rect x="1109" y="504" width="676" height="82" rx="8" class="mc-box"/>
  <rect x="1125" y="520" width="86" height="25" rx="5" fill="#D55E00"/>
  <text x="1168" y="538" text-anchor="middle" class="badge">STAGE B</text>
  <text x="1232" y="535" class="node-title">PSF 与最优孔径</text>
  <text x="1138" y="564" class="node-sub">Rayleigh/精细 PSF 拟合 → sigma、r_opt 与 containment</text>

  <path d="M473,586 C473,628 705,626 805,654" class="arrow-blue"/>
  <path d="M1447,586 C1447,628 1215,626 1115,654" class="arrow-orange"/>

  <rect x="560" y="642" width="800" height="92" rx="8" class="fit-box"/>
  <text x="960" y="676" text-anchor="middle" class="node-title">响应方案 + 固定 44-cell selector + 源曝光</text>
  <text x="960" y="706" text-anchor="middle" class="node-sub">B: MC aperture-conditioned response；R: 0.715 × nominal Aeff；时间信息给出 source transit exposure</text>

  <path d="M960,734 L960,760" class="arrow-green"/>
  <rect x="560" y="764" width="800" height="92" rx="8" class="fit-box"/>
  <rect x="580" y="782" width="86" height="25" rx="5" fill="#009E73"/>
  <text x="623" y="800" text-anchor="middle" class="badge">STAGE F</text>
  <text x="690" y="798" class="node-title">Forward Folding：由试探能谱预测每个 cell 的计数</text>
  <text x="960" y="833" text-anchor="middle" class="node-sub">mu_i = ∫ Phi(E) · Aeff_i(E,theta) · T(theta) dE dtheta；与观测 excess_i 联合拟合</text>

  <path d="M960,856 L960,882" class="arrow-green"/>
  <rect x="560" y="886" width="800" height="78" rx="8" class="fit-box"/>
  <text x="960" y="919" text-anchor="middle" class="node-title">全局光谱拟合与模型选择</text>
  <text x="960" y="947" text-anchor="middle" class="node-sub">PL vs LogPar；MIGRAD + HESSE → 最优参数、协方差、chi2/ndof</text>

  <path d="M960,964 L960,988" class="arrow-green"/>
  <rect x="390" y="992" width="1140" height="72" rx="8" class="out-box"/>
  <rect x="410" y="1008" width="86" height="25" rx="5" fill="#C79200"/>
  <text x="453" y="1026" text-anchor="middle" class="badge">STAGE G</text>
  <text x="525" y="1023" class="node-title">最终 SED：固定全局谱形，按 Nhit / predE 分组重拟合归一化</text>
  <text x="525" y="1050" class="node-sub">输出 Eeff、SED 点与误差、LogPar 曲线和拟合误差带，并与 official Pass5 比较</text>

  <text x="1820" y="1055" text-anchor="end" class="small">v6_64748 · Stage A-G</text>
</svg>
